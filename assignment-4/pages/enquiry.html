<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
      <style>
        a{
            text-decoration: none;
            padding-right: 10px;
            font-size: x-large;
        }
    </style>
</head>
<body>
    
<nav>
    <a href="../index.html">الرئيسية</a>
    <a href="schedule.html">المواعيد</a>
    <a href="enquiry.html">الاستفسار</a>
</nav>
<h2>نموذج الاستفسار</h2>

    <form>

        <label for="full-name">الاسم الكامل:</label>
        <input type="text"
               id="full-name"
               name="fullName"
               placeholder="مثال: حمزة احمد"
               autocomplete="name">
        <br>
        <br>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email"
               id="email"
               name="email"
               autocomplete="email">
        <br><br>

        <label for="phone">رقم الهاتف:</label>
        <input type="tel"
               id="phone"
               name="phone"
               autocomplete="tel">
        <br><br>

        <label for="course">الكورس:</label>
        <select id="course" name="course">
            <option value="" selected>
                اختر كورس
            </option>
            <option value="content">
                HTML Content
            </option>
            <option value="forms">
                HTML Forms
            </option>
        </select>
        <br><br>

        <label for="seats">عدد المقاعد:</label>
        <input type="number"
               id="seats"
               name="seats"
               value="1"
               min="1">
        <br><br>

        <label for="preferred-date">التاريخ المفضل:</label>
        <input type="date"
               id="preferred-date"
               name="preferredDate">
        <br><br>

        <label for="message">نص الاستفسار:</label>
        <textarea id="message"
                  name="message"
                  rows="5"
                  cols="40"></textarea>
        <br><br>

        <button type="submit">إرسال الاستفسار</button>

    </form>
</body>
</html>
